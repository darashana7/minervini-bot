services:
  - type: web
    name: minervini-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python render_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: minervini-redis
          property: connectionString
    healthCheckPath: /health

  - type: redis
    name: minervini-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
